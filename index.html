<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A1A22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KubeCon">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>KubeCon Companion</title>
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <nav id="tabs" aria-label="Main">
    <button data-tab="schedule" aria-label="Schedule"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Schedule</span></button>
    <button data-tab="people" aria-label="People"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 5.2a3.4 3.4 0 0 1 0 6.6M18.5 14.8c1.7.7 2.7 2.3 3 4.7"/></svg><span>People</span><i id="people-count" hidden></i></button>
    <button data-tab="capture" class="capture-tab" aria-label="Capture a conversation"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="badge" aria-label="My badge"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><path d="M14 14h3v3h-3zM20.5 14v6.5H17.5M14 20.5h.01"/></svg><span>My QR</span></button>
    <button data-tab="debrief" aria-label="Debrief"><svg viewBox="0 0 24 24"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8.5h5M9 13h7M9 16.5h5"/></svg><span>Debrief</span></button>
  </nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>
<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
